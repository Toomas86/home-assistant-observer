configuration:
  tunnel_id:
    name: OpenAI tunneli ID
    description: OpenAI Platformi tunneliseadetest saadud tunnel_... identifikaator.
  openai_runtime_api_key:
    name: OpenAI käitusvõti
    description: Ainult tunneli käitamiseks mõeldud võti Tunnels Read ja Use õigustega. Ära kasuta administraatorivõtit.
  retention_days:
    name: Vigade säilitamine päevades
    description: Kui kaua säilitatakse kohalikus andmebaasis puhastatud HA hoiatusi ja vigu.
  allow_sensitive_entities:
    name: Luba tundlikud olemid
    description: Lubab lugeda kaamerate, isikute, seadmejälgijate, piltide ja geograafiliste olemite metaandmeid. Soovitus on välja lülitatud.
  config_management_enabled:
    name: Luba YAML-konfiguratsiooni haldus
    description: Lubab piiratud YAML-i lugemise, muudatuste ettevalmistuse, HA kontrolli, kinnitatud rakendamise ja tagasipööramise. Turvaline vaikeväärtus on välja lülitatud.
  log_level:
    name: Rakenduse logitase
    description: Vaatleja ja tunneli logide detailsus.
