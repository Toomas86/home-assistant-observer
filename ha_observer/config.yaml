name: Home Assistant Observer for ChatGPT
version: "0.2.0"
slug: ha_observer
description: Privacy-redacted diagnostics and opt-in transactional YAML management through an OpenAI Secure MCP Tunnel
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
homeassistant: "2024.6.0"
stage: experimental
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
options:
  tunnel_id: null
  openai_runtime_api_key: null
  retention_days: 30
  allow_sensitive_entities: false
  config_management_enabled: false
  log_level: info
schema:
  tunnel_id: "match(^tunnel_[A-Za-z0-9_-]+$)"
  openai_runtime_api_key: password
  retention_days: "int(1,365)"
  allow_sensitive_entities: bool
  config_management_enabled: bool
  log_level: "list(debug|info|warning|error)"
