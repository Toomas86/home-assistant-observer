name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q ha_observer/rootfs/app/observer tests
      - name: Check shell script
        run: shellcheck ha_observer/run.sh
